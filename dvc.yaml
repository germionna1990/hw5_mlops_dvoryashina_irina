stages:
  prepare:
    cmd: python src/prepare.py
    deps:
    - data/raw/data.csv
    - src/prepare.py
    outs:
    - data/processed
    params:
    - random_state
    - split_ratio
  train:
    cmd: python src/train.py
    deps:
    - data/processed
    - src/train.py
    outs:
    - model.pkl
    params:
    - n_estimators
    - random_state
